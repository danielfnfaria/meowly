# Local cluster: the whole platform in the `meowly` namespace of minikube.
#
#   make minikube-start && make minikube-dev
#
# The three images are built straight into minikube's Docker (no registry, no push) with a
# content tag, so the chart's `IfNotPresent` always runs what was just built. No ingress and
# no cert-manager: skaffold port-forwards the API (and Postgres, to look at the catalog).
#
# `kubeContext: minikube` is pinned on purpose: the current context may be a real cluster.
apiVersion: skaffold/v4beta11
kind: Config
metadata:
  name: meowly

build:
  tagPolicy:
    inputDigest: {}
  local:
    push: false
    useBuildkit: true
  artifacts:
    - image: meowly-api
      context: .
      docker:
        dockerfile: apps/api/Dockerfile
    - image: meowly-controller
      context: .
      docker:
        dockerfile: apps/controller/Dockerfile
    - image: meowly-worker
      context: .
      docker:
        dockerfile: apps/worker/Dockerfile

manifests:
  helm:
    releases:
      - name: meowly
        chartPath: deploy/charts/meowly
        valuesFiles:
          - deploy/values/minikube.yaml
        namespace: meowly
        createNamespace: true
        setValueTemplates:
          api.image.repository: "{{.IMAGE_REPO_meowly_api}}"
          api.image.tag: "{{.IMAGE_TAG_meowly_api}}"
          controller.image.repository: "{{.IMAGE_REPO_meowly_controller}}"
          controller.image.tag: "{{.IMAGE_TAG_meowly_controller}}"
          worker.image.repository: "{{.IMAGE_REPO_meowly_worker}}"
          worker.image.tag: "{{.IMAGE_TAG_meowly_worker}}"
        version: 0.1.1

deploy:
  kubeContext: minikube
  helm: {}
  statusCheckDeadlineSeconds: 300

portForward:
  - resourceType: service
    resourceName: meowly-api
    namespace: meowly
    port: 8000
    localPort: 8000
  - resourceType: service
    resourceName: meowly-postgresql
    namespace: meowly
    port: 5432
    localPort: 5432
