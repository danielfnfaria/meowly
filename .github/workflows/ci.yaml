name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -n auto

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/charts/meowly
      - run: helm lint deploy/charts/meowly -f deploy/values/minikube.yaml
      - run: helm template --kube-version 1.30.0 meowly deploy/charts/meowly -n meowly > /dev/null
      - run: helm template --kube-version 1.30.0 meowly deploy/charts/meowly -n meowly -f deploy/values/minikube.yaml > /dev/null

  ui:
    # apps/ui is created in a later change: skip the job until it has a package.json,
    # so CI stays green on commits that precede the UI.
    if: ${{ hashFiles('apps/ui/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
