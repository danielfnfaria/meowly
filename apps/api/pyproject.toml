[project]
name = "meowly-api"
version = "0.1.0"
description = "meowly API: the catalog and the tasks over HTTP under /v1, and the admin UI on /"
requires-python = ">=3.13"
dependencies = [
    "meowly-contracts",
    "meowly-runtime",
    "meowly-core[migrations]",
    "meowly-http",
    "fastapi>=0.116",
    "pydantic>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "structlog>=25",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "aiosqlite>=0.21",
]

[project.scripts]
meowly-api = "meowly_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meowly_api"]
