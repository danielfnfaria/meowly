[project]
name = "purr-api"
version = "0.1.0"
description = "purr API: the catalog and the tasks over HTTP under /v1, and the admin UI on /"
requires-python = ">=3.13"
dependencies = [
    "purr-contracts",
    "purr-runtime",
    "purr-core[migrations]",
    "purr-http",
    "fastapi>=0.116",
    "pydantic>=2.11",
    "sqlalchemy[asyncio]>=2.0.43",
    "structlog>=25",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "aiosqlite>=0.21",
]

[project.scripts]
purr-api = "purr_api.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purr_api"]
