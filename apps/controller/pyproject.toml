[project]
name = "purr-controller"
version = "0.1.0"
description = "purr controller: Kubernetes operator reconciling PlatformTask -> Job"
requires-python = ">=3.13"
dependencies = [
    "purr-contracts",
    "purr-runtime",
    "kopf>=1.37",
    "lightkube>=0.17",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25",
]

[project.scripts]
purr-controller = "purr_controller.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purr_controller"]
