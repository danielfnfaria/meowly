[project]
name = "meowly-controller"
version = "0.1.0"
description = "meowly controller: Kubernetes operator reconciling PlatformTask -> Job"
requires-python = ">=3.13"
dependencies = [
    "meowly-contracts",
    "meowly-runtime",
    "kopf>=1.37",
    "lightkube>=0.17",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25",
]

[project.scripts]
meowly-controller = "meowly_controller.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meowly_controller"]
