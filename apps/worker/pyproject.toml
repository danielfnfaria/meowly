[project]
name = "purr-worker"
version = "0.1.0"
description = "purr worker: the process of the pod a Job runs for one PlatformTask"
requires-python = ">=3.13"
dependencies = [
    "purr-contracts",
    "purr-engine",
    "purr-runtime",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25",
]

[project.scripts]
purr-worker = "purr_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purr_worker"]
