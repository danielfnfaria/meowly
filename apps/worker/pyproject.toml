[project]
name = "meowly-worker"
version = "0.1.0"
description = "meowly worker: the process of the pod a Job runs for one PlatformTask"
requires-python = ">=3.13"
dependencies = [
    "meowly-contracts",
    "meowly-engine",
    "meowly-runtime",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25",
]

[project.scripts]
meowly-worker = "meowly_worker.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meowly_worker"]
