# Overlay that `skaffold dev` applies (skaffold.yaml -> manifests.helm.releases[].valuesFiles) on
# the local minikube. No ingress: everything is reached through port-forward (API/UI on :8000,
# Postgres on :5432). Images and tags are set by skaffold itself.
postgresql:
  enabled: true

api:
  publicUrl: http://localhost:8000
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  podDisruptionBudget:
    enabled: false

controller:
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 25m
      memory: 96Mi
    limits:
      memory: 192Mi

worker:
  image:
    pullPolicy: IfNotPresent
