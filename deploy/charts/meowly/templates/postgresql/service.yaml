{{- if .Values.postgresql.enabled }}
{{- $ctx := dict "root" $ "component" "postgresql" }}
# DEVELOPMENT ONLY (see secret.yaml).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meowly.componentName" $ctx }}
  labels:
    {{- include "meowly.componentLabels" $ctx | nindent 4 }}
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    {{- include "meowly.selectorLabels" $ctx | nindent 4 }}
{{- end }}
