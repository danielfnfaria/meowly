{{- $ctx := dict "root" $ "component" "controller" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "meowly.componentName" $ctx }}
  labels:
    {{- include "meowly.componentLabels" $ctx | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "meowly.componentName" $ctx }}
subjects:
  - kind: ServiceAccount
    name: {{ include "meowly.componentName" $ctx }}
    namespace: {{ .Release.Namespace }}
