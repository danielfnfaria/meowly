{{- $ctx := dict "root" $ "component" "api" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "meowly.componentName" $ctx }}
  labels:
    {{- include "meowly.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "meowly.selectorLabels" $ctx | nindent 4 }}
