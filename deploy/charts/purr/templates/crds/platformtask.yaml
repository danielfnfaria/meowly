{{- if .Values.crds.install }}
# The CRD lives in templates/ (not in crds/) on purpose: that way it is rendered by
# `helm template`, can be switched off with `crds.install=false`, and is upgraded with the
# release. Consequence: the CRD is owned by the release - uninstalling it deletes the CRD and
# every PlatformTask; upgrading the CRD is the release's responsibility, not Helm's crds/ rules.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: platformtasks.purr.sh
  labels:
    {{- include "purr.labels" . | nindent 4 }}
spec:
  group: purr.sh
  scope: Namespaced
  names:
    kind: PlatformTask
    listKind: PlatformTaskList
    plural: platformtasks
    singular: platformtask
    shortNames:
      - ptask
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Kind
          type: string
          jsonPath: .spec.kind
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - kind
                - requested_by
              properties:
                spec_version:
                  type: integer
                kind:
                  type: string
                  enum: [noop, scaffold, provision]
                component:
                  type: string
                template:
                  type: string
                inputs:
                  type: object
                  additionalProperties:
                    type: string
                requested_by:
                  type: string
                trace_id:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [pending, running, succeeded, failed, cancelled]
                message:
                  type: string
                started_at:
                  type: string
                finished_at:
                  type: string
                outputs:
                  type: object
                  additionalProperties:
                    type: string
                error:
                  type: string
{{- end }}
