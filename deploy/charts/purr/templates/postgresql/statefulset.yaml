{{- if .Values.postgresql.enabled }}
{{- $ctx := dict "root" $ "component" "postgresql" }}
{{- $b := .Values.postgresql }}
# DEVELOPMENT ONLY: a single non-replicated Postgres. Production uses a managed database via
# api.database.existingSecret.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "purr.componentName" $ctx }}
  labels:
    {{- include "purr.componentLabels" $ctx | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "purr.componentName" $ctx }}
  selector:
    matchLabels:
      {{- include "purr.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "purr.componentLabels" $ctx | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgresql
          image: "{{ $b.image.repository }}:{{ $b.image.tag }}"
          imagePullPolicy: {{ $b.image.pullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: {{ $b.auth.username | quote }}
            - name: POSTGRES_DB
              value: {{ $b.auth.database | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "purr.componentName" $ctx }}
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $b.auth.username | quote }}, "-d", {{ $b.auth.database | quote }}]
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            {{- toYaml $b.resources | nindent 12 }}
      {{- if not $b.persistence.enabled }}
      volumes:
        - name: data
          emptyDir: {}
      {{- end }}
  {{- if $b.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with $b.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ $b.persistence.size }}
  {{- end }}
{{- end }}
