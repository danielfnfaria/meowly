{{- if .Values.postgresql.enabled }}
{{- $ctx := dict "root" $ "component" "postgresql" }}
# DEVELOPMENT ONLY. Production uses a managed database through api.database.existingSecret.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "purr.componentName" $ctx }}
  labels:
    {{- include "purr.componentLabels" $ctx | nindent 4 }}
type: Opaque
stringData:
  password: {{ .Values.postgresql.auth.password | quote }}
{{- end }}
