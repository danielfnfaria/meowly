{{- $ctx := dict "root" $ "component" "worker" }}
# Identity of the worker Jobs, deliberately WITHOUT any Role/RoleBinding: the worker pod talks
# neither to the Kubernetes API nor to the database. It receives its spec from the controller
# and reports through JSONL events on stdout.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "purr.workerServiceAccountName" . }}
  labels:
    {{- include "purr.componentLabels" $ctx | nindent 4 }}
automountServiceAccountToken: false
