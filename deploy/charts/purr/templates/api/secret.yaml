{{- /* Where the API's database URL comes from, in order: an existing Secret (production:
       a managed database), api.database.url, or the chart's own dev Postgres. Without any of
       the three there is no database to point at, so the render fails here rather than
       installing an API that crash-loops against a Service that does not exist. */}}
{{- if not .Values.api.database.existingSecret }}
{{- $ctx := dict "root" $ "component" "api" }}
{{- $url := .Values.api.database.url }}
{{- if not $url }}
{{- if not .Values.postgresql.enabled }}
{{- fail "purr: set api.database.existingSecret (recommended) or api.database.url when postgresql.enabled is false" }}
{{- end }}
{{- $url = printf "postgresql+asyncpg://%s:%s@%s:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "purr.componentName" (dict "root" $ "component" "postgresql")) .Values.postgresql.auth.database }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "purr.componentName" $ctx }}
  labels:
    {{- include "purr.componentLabels" $ctx | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ $url | quote }}
{{- end }}
