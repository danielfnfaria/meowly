{{- $ctx := dict "root" $ "component" "api" }}
# Namespaced: the API only creates and reads PlatformTasks. No pods/log: the stdout of every
# worker must not be reachable from an unauthenticated HTTP process.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "purr.componentName" $ctx }}
  labels:
    {{- include "purr.componentLabels" $ctx | nindent 4 }}
rules:
  - apiGroups: ["purr.sh"]
    resources: ["platformtasks"]
    verbs: ["create", "get", "list", "watch"]
