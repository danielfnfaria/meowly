[project]
name = "purr-contracts"
version = "0.1.0"
description = "purr contracts: the wire between the API, the controller and the worker (task specs, statuses, events, the PlatformTask envelope and the domain errors)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purr_contracts"]
