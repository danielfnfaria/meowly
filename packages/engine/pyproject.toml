[project]
name = "purr-engine"
version = "0.1.0"
description = "purr engine: runs one task and reports it as a JSONL event stream (used by the worker pod)"
requires-python = ">=3.13"
dependencies = [
    "purr-contracts",
    "structlog>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purr_engine"]
