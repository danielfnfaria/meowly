[project]
name = "meowly-core"
version = "0.1.0"
description = "meowly core: the catalog (Postgres) and the dispatch of tasks (Kubernetes)"
requires-python = ">=3.13"
dependencies = [
    "meowly-contracts",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.43",
    "asyncpg>=0.30",
    "lightkube>=0.17",
    "structlog>=25",
]

[project.optional-dependencies]
# Only the API image runs migrations (its init step); the others do not carry alembic.
migrations = ["alembic>=1.16"]

[dependency-groups]
dev = [
    "aiosqlite>=0.21",
    "alembic>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meowly_core"]
