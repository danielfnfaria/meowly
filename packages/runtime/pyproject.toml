[project]
name = "purr-runtime"
version = "0.1.0"
description = "Process plumbing shared by every purr process: JSON logging and the server bind settings"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
    "structlog>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/purr_runtime"]
